services:
  - type: web
    name: smartschool-cloud-erp
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4 --limit-concurrency 10000 --backlog 4096
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_SECURITY_ALERTS
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com"
