<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gradGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" rx="40" fill="#11131A"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="200" cy="180" r="110" fill="url(#gradGlow)" filter="url(#glow)"/>

  <!-- Graduation Cap Icon -->
  <g transform="translate(100, 80)">
    <!-- Cap Diamond -->
    <polygon points="100,20 10,65 100,110 190,65" fill="url(#gradPrimary)" stroke="#60A5FA" stroke-width="2"/>
    <!-- Cap Skull Base -->
    <path d="M40,80 L40,120 Q100,155 160,120 L160,80" fill="#1E2230" stroke="#3B82F6" stroke-width="3"/>
    <!-- Tassel Cord -->
    <path d="M165,65 Q175,95 175,130" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="175" cy="135" r="6" fill="#F59E0B"/>
  </g>

  <!-- Typography -->
  <text x="200" y="295" font-family="'Tajawal', 'Segoe UI', sans-serif" font-size="28" font-weight="800" fill="#F8FAFC" text-anchor="middle">منظومة المدرسة الذكية</text>
  <text x="200" y="325" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#3B82F6" text-anchor="middle" letter-spacing="1.5">CLOUD SECURE SCHOOL ERP</text>

  <!-- Accent Divider -->
  <line x1="120" y1="345" x2="280" y2="345" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
