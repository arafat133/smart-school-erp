<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Capsule Container -->
  <rect x="10" y="10" width="480" height="120" rx="60" fill="#181B26" stroke="#10B981" stroke-width="2" filter="url(#badgeShadow)"/>
  <rect x="14" y="14" width="472" height="112" rx="56" fill="url(#badgeGrad)"/>

  <!-- Left Icon Circle -->
  <circle cx="70" cy="70" r="38" fill="#10B981"/>
  <!-- Checkmark SVG inside Icon -->
  <path d="M54 70 L65 81 L86 58" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge Text RTL & LTR -->
  <text x="130" y="60" font-family="'Tajawal', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">محرك الجدولة الذكي CSP</text>
  <text x="130" y="92" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#34D399">100% CONFLICT-FREE TIMETABLE</text>

  <!-- Right Pill Status -->
  <rect x="360" y="48" width="105" height="42" rx="21" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="412" y="75" font-family="'Tajawal', sans-serif" font-size="16" font-weight="800" fill="#A7F3D0" text-anchor="middle">صفر تعارض</text>
</svg>
