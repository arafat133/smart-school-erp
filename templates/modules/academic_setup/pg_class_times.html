<div class="page" id="pg-class-times">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-clock"></i> أوقات الحصص والفترات الدراسية (Class Times & Period Schedule)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-clock" style="color:#3b82f6;margin-left:6px;"></i> عدد الفترات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="ctTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">فترات الدوام المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-hourglass" style="color:#10b981;margin-left:6px;"></i> مدة الحصة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="ctDuration">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">المدة الافتراضية للحصة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-mug-hot" style="color:#f59e0b;margin-left:6px;"></i> فترات الاستراحة</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="ctBreaks">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد أوقات الاستراحة</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchClasstimes" placeholder="بحث في أوقات الحصص..." oninput="renderClassTimesGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('class-times')"><i class="fa-solid fa-plus"></i> إضافة فترة حصة جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>رقم الحصة</th>
                    <th>وقت البداية</th>
                    <th>وقت النهاية</th>
                    <th>المدة (دقيقة)</th>
                    <th>النوع</th>
                    <th>ملاحظات</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-class-times-grid"></tbody>
        </table>
    </div>
</div>
