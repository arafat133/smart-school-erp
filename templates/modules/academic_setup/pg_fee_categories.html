<div class="page" id="pg-fee-categories">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-tags"></i> تصنيفات وأنواع الرسوم الدراسية (Fee Categories & Types)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-tags" style="color:#3b82f6;margin-left:6px;"></i> إجمالي التصنيفات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="fcTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد تصنيفات الرسوم</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #ef4444;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-circle-exclamation" style="color:#ef4444;margin-left:6px;"></i> رسوم إلزامية</h3>
                                <p style="color:#f87171;font-weight:800;font-size:1.2rem;" id="fcMandatory">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الرسوم الواجبة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-circle-check" style="color:#10b981;margin-left:6px;"></i> رسوم اختيارية</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="fcOptional">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">رسوم إضافية اختيارية</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;flex:1;max-width:560px;flex-wrap:wrap;">
            <div class="search-box" style="flex:1;min-width:240px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchFeecategories" placeholder="بحث في تصنيفات الرسوم..." oninput="renderFeeCategoriesGrid()">
            </div>
            <select id="filterFeeType" onchange="renderFeeCategoriesGrid()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#cbd5e1;padding:8px 14px;border-radius:8px;outline:none;cursor:pointer;font-family:inherit;">
                <option value="all">كل تصنيفات وأنواع الرسوم</option>
                <option value="إلزامي">رسوم إلزامية فقط 🔴</option>
                <option value="اختياري">رسوم اختيارية فقط 🟢</option>
                <option value="تعليمية">رسوم تعليمية أساسية 📚</option>
                <option value="خدمية">رسوم خدمات ونقل وأنشطة 🚌</option>
            </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('fee-categories')"><i class="fa-solid fa-plus"></i> إضافة تصنيف رسوم جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود التصنيف</th>
                    <th>اسم التصنيف</th>
                    <th>النوع</th>
                    <th>المبلغ الافتراضي</th>
                    <th>إلزامي؟</th>
                    <th>المرحلة</th>
                    <th>الوصف</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-fee-categories-grid"></tbody>
        </table>
    </div>
</div>
