<div class="page" id="pg-subject-distribution">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-share-nodes"></i> توزيع المواد على المعلمين والصفوف (Subject-Teacher Distribution)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-share-nodes" style="color:#3b82f6;margin-left:6px;"></i> إجمالي التوزيعات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="sdTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد عمليات التوزيع</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-chalkboard-user" style="color:#10b981;margin-left:6px;"></i> معلمون موزعون</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="sdTeachers">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">المعلمون المكلفون</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #ef4444;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-circle-xmark" style="color:#ef4444;margin-left:6px;"></i> مواد غير موزعة</h3>
                                <p style="color:#f87171;font-weight:800;font-size:1.2rem;" id="sdUnassigned">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">مواد بدون معلم</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchSubjectdistribution" placeholder="بحث بالمعلم أو المادة..." oninput="renderSubjectDistributionGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('subject-distribution')"><i class="fa-solid fa-plus"></i> إضافة توزيع مادة جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>المعلم</th>
                    <th>المادة</th>
                    <th>المرحلة</th>
                    <th>الصف</th>
                    <th>الشعبة</th>
                    <th>عدد الحصص</th>
                    <th>الفصل الدراسي</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-subject-distribution-grid"></tbody>
        </table>
    </div>
</div>
