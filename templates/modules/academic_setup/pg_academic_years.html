<div class="page" id="pg-academic-years">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-calendar-days"></i> إدارة السنوات والفصول الدراسية (Academic Years & Semesters)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-calendar" style="color:#3b82f6;margin-left:6px;"></i> السنوات الدراسية</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="ayTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">إجمالي السنوات المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-calendar-check" style="color:#10b981;margin-left:6px;"></i> السنة الحالية</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="ayCurrent">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">السنة الدراسية النشطة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-layer-group" style="color:#f59e0b;margin-left:6px;"></i> الفصول النشطة</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="ayTerms">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الفصول الدراسية الجارية</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchAcademicyears" placeholder="بحث في السنوات الدراسية..." oninput="renderAcademicYearsGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('academic-years')"><i class="fa-solid fa-plus"></i> إضافة سنة دراسية جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود السنة</th>
                    <th>اسم السنة الدراسية</th>
                    <th>تاريخ البداية</th>
                    <th>تاريخ النهاية</th>
                    <th>عدد الفصول</th>
                    <th>الحالة</th>
                    <th>ملاحظات</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-academic-years-grid"></tbody>
        </table>
    </div>
</div>
