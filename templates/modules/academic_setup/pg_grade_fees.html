<div class="page" id="pg-grade-fees">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-money-bill-1-wave"></i> رسوم الصفوف والمراحل الدراسية (Grade & Stage Fee Configuration)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-money-bill-1-wave" style="color:#3b82f6;margin-left:6px;"></i> إجمالي التسعيرات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="gfTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد تسعيرات الرسوم</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-layer-group" style="color:#10b981;margin-left:6px;"></i> مراحل مسعرة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="gfStages">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">المراحل المحددة رسومها</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-calculator" style="color:#f59e0b;margin-left:6px;"></i> متوسط الرسوم</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="gfAvg">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">متوسط رسوم الصف الواحد</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchGradefees" placeholder="بحث في رسوم الصفوف..." oninput="renderGradeFeesGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('grade-fees')"><i class="fa-solid fa-plus"></i> تحديد رسوم صف جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>المرحلة</th>
                    <th>الصف</th>
                    <th>نوع الرسم</th>
                    <th>المبلغ</th>
                    <th>العملة</th>
                    <th>الفصل الدراسي</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-grade-fees-grid"></tbody>
        </table>
    </div>
</div>
