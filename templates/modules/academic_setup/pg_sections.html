<div class="page" id="pg-sections">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-users-rectangle"></i> إدارة الشعب والفصول الدراسية (Sections & Class Groups)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-users-rectangle" style="color:#3b82f6;margin-left:6px;"></i> إجمالي الشعب</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="secTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد الشعب المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-check-double" style="color:#10b981;margin-left:6px;"></i> شعب نشطة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="secActive">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الشعب المفعلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-user-graduate" style="color:#f59e0b;margin-left:6px;"></i> إجمالي الطلاب</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="secStudents">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">طلاب موزعون على الشعب</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchSections" placeholder="بحث في الشعب الدراسية..." oninput="renderSectionsGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('sections')"><i class="fa-solid fa-plus"></i> إضافة شعبة دراسية جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود الشعبة</th>
                    <th>اسم الشعبة</th>
                    <th>المرحلة</th>
                    <th>الصف</th>
                    <th>السعة القصوى</th>
                    <th>عدد الطلاب</th>
                    <th>المشرف</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-sections-grid"></tbody>
        </table>
    </div>
</div>
