<div class="page" id="pg-installment-plans">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-calendar-check"></i> خطط التقسيط والسداد المرنة (Installment & Payment Plans)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-calendar-check" style="color:#3b82f6;margin-left:6px;"></i> إجمالي الخطط</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="ipTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد خطط التقسيط</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-circle-check" style="color:#10b981;margin-left:6px;"></i> خطط نشطة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="ipActive">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الخطط المفعلة حالياً</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-users" style="color:#f59e0b;margin-left:6px;"></i> طلاب مستفيدون</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="ipStudents">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد الطلاب على خطط تقسيط</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;flex:1;max-width:560px;flex-wrap:wrap;">
            <div class="search-box" style="flex:1;min-width:240px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchInstallmentplans" placeholder="بحث في خطط التقسيط..." oninput="renderInstallmentPlansGrid()">
            </div>
            <select id="filterInstallmentType" onchange="renderInstallmentPlansGrid()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#cbd5e1;padding:8px 14px;border-radius:8px;outline:none;cursor:pointer;font-family:inherit;">
                <option value="all">كل خطط التقسيط والسداد</option>
                <option value="نشطة">خطط نشطة ومعتمدة 🟢</option>
                <option value="4">خطط ربع سنوية (4 أقساط)</option>
                <option value="3">خطط ثلاثية (3 أقساط)</option>
                <option value="فصلي">خطط فصلية (دفعتان)</option>
                <option value="شهري">أقساط شهرية ميسرة</option>
            </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('installment-plans')"><i class="fa-solid fa-plus"></i> إضافة خطة تقسيط جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود الخطة</th>
                    <th>اسم الخطة</th>
                    <th>عدد الأقساط</th>
                    <th>مدة القسط</th>
                    <th>نسبة الدفعة الأولى</th>
                    <th>المرحلة</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-installment-plans-grid"></tbody>
        </table>
    </div>
</div>
