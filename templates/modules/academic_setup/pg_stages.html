<div class="page" id="pg-stages">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-layer-group"></i> المراحل الدراسية والصفوف (Educational Stages & Grades)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-layer-group" style="color:#3b82f6;margin-left:6px;"></i> إجمالي المراحل</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="stgTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد المراحل المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-list-ol" style="color:#10b981;margin-left:6px;"></i> إجمالي الصفوف</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="stgGrades">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">مجموع الصفوف في كل المراحل</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-circle-check" style="color:#f59e0b;margin-left:6px;"></i> مراحل نشطة</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="stgActive">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">المراحل المفعلة حالياً</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchStages" placeholder="بحث في المراحل الدراسية..." oninput="renderStagesGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('stages')"><i class="fa-solid fa-plus"></i> إضافة مرحلة دراسية جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود المرحلة</th>
                    <th>اسم المرحلة</th>
                    <th>عدد الصفوف</th>
                    <th>عدد الشعب</th>
                    <th>عدد الطلاب</th>
                    <th>الحالة</th>
                    <th>ملاحظات</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-stages-grid"></tbody>
        </table>
    </div>
</div>
