<div class="page" id="pg-classrooms">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-door-open"></i> إدارة القاعات والفصول الدراسية (Classrooms & Halls Management)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-door-open" style="color:#3b82f6;margin-left:6px;"></i> إجمالي القاعات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="clsTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد القاعات المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-circle-check" style="color:#10b981;margin-left:6px;"></i> قاعات متاحة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="clsAvail">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">القاعات الجاهزة للاستخدام</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-users" style="color:#f59e0b;margin-left:6px;"></i> السعة الإجمالية</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="clsCapacity">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">مجموع سعة جميع القاعات</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;flex:1;max-width:560px;flex-wrap:wrap;">
            <div class="search-box" style="flex:1;min-width:240px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchClassrooms" placeholder="بحث في القاعات..." oninput="renderClassroomsGrid()">
            </div>
            <select id="filterRoomType" onchange="renderClassroomsGrid()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#cbd5e1;padding:8px 14px;border-radius:8px;outline:none;cursor:pointer;font-family:inherit;">
                <option value="all">كل أنواع القاعات والمعامل</option>
                <option value="صفية">قاعات صفية قياسية</option>
                <option value="علوم">معامل علوم وفيزياء</option>
                <option value="حاسوب">معامل حاسوب وذكاء اصطناعي</option>
                <option value="أنشطة">صالات أنشطة ومسارح</option>
            </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('classrooms')"><i class="fa-solid fa-plus"></i> إضافة قاعة دراسية جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود القاعة</th>
                    <th>اسم القاعة</th>
                    <th>المبنى / الطابق</th>
                    <th>السعة</th>
                    <th>النوع</th>
                    <th>التجهيزات</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-classrooms-grid"></tbody>
        </table>
    </div>
</div>
