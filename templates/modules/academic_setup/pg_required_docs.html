<div class="page" id="pg-required-docs">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-file-lines"></i> الوثائق والمستندات المطلوبة للتسجيل (Required Enrollment Documents)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-file-lines" style="color:#3b82f6;margin-left:6px;"></i> إجمالي الوثائق</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="rdTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد أنواع الوثائق</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #ef4444;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-asterisk" style="color:#ef4444;margin-left:6px;"></i> وثائق إلزامية</h3>
                                <p style="color:#f87171;font-weight:800;font-size:1.2rem;" id="rdRequired">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">يجب توفيرها للتسجيل</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-file-circle-question" style="color:#f59e0b;margin-left:6px;"></i> وثائق اختيارية</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="rdOptional">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">يمكن الاستغناء عنها</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchRequireddocs" placeholder="بحث في الوثائق المطلوبة..." oninput="renderRequiredDocsGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('required-docs')"><i class="fa-solid fa-plus"></i> إضافة نوع وثيقة جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود الوثيقة</th>
                    <th>اسم الوثيقة</th>
                    <th>النوع</th>
                    <th>إلزامية؟</th>
                    <th>المرحلة</th>
                    <th>الوصف</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-required-docs-grid"></tbody>
        </table>
    </div>
</div>
