<div class="page" id="pg-discount-categories">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-percent"></i> فئات وأنواع الخصومات والتخفيضات (Discount Categories & Types)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-percent" style="color:#3b82f6;margin-left:6px;"></i> إجمالي الخصومات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="dcTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد فئات الخصم</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-tag" style="color:#10b981;margin-left:6px;"></i> خصومات نشطة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="dcActive">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">المفعلة حالياً</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-user-graduate" style="color:#f59e0b;margin-left:6px;"></i> طلاب مستفيدون</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="dcBeneficiaries">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الطلاب الحاصلون على خصم</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchDiscountcategories" placeholder="بحث في فئات الخصومات..." oninput="renderDiscountCategoriesGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('discount-categories')"><i class="fa-solid fa-plus"></i> إضافة فئة خصم جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود الخصم</th>
                    <th>اسم الخصم</th>
                    <th>النوع</th>
                    <th>النسبة / المبلغ</th>
                    <th>الشروط</th>
                    <th>المرحلة</th>
                    <th>الحالة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-discount-categories-grid"></tbody>
        </table>
    </div>
</div>
