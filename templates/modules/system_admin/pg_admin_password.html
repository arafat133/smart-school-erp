<div class="page" id="pg-admin-password">
                    <div class="page-header">
                        <h2><i class="fa-solid fa-key"></i> تغيير كلمة السر</h2>
                    </div>
                    <div class="form-card"
                        style="max-width:550px;margin:30px auto;padding:30px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08);">
                        <div style="text-align:center;margin-bottom:25px;">
                            <div
                                style="width:60px;height:60px;background:#eff6ff;color:#3b82f6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 15px;">
                                <i class="fa-solid fa-lock"></i>
                            </div>
                            <h3 style="margin:0;color:#1e3a8a;font-size:1.4rem;"><i class="fa-solid fa-key"></i> تحديث
                                كلمة مرور حساب مدير النظام</h3>
                            <p style="color:#64748b;font-size:0.9rem;margin-top:5px;">يرجى إدخال كلمة المرور الحالية ثم
                                الجديدة وتأكيدها لحماية النظام</p>
                        </div>

                        <div style="display:flex;flex-direction:column;gap:18px;">
                            <div>
                                <label style="display:block;font-weight:600;margin-bottom:8px;color:#333;">كلمة السر
                                    الحالية <span style="color:red;">*</span></label>
                                <div style="position:relative;">
                                    <input type="password" id="adminOldPass"
                                        placeholder="أدخل كلمة السر الحالية (admin123)"
                                        style="width:100%;box-sizing:border-box;padding:12px 40px 12px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;outline:none;">
                                    <i class="fa-solid fa-key"
                                        style="position:absolute;right:12px;top:15px;color:#94a3b8;"></i>
                                </div>
                            </div>

                            <div>
                                <label style="display:block;font-weight:600;margin-bottom:8px;color:#333;">كلمة السر
                                    الجديدة <span style="color:red;">*</span></label>
                                <div style="position:relative;">
                                    <input type="password" id="adminNewPass" placeholder="أدخل كلمة السر الجديدة"
                                        style="width:100%;box-sizing:border-box;padding:12px 40px 12px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;outline:none;">
                                    <i class="fa-solid fa-lock"
                                        style="position:absolute;right:12px;top:15px;color:#94a3b8;"></i>
                                </div>
                            </div>

                            <div>
                                <label style="display:block;font-weight:600;margin-bottom:8px;color:#333;">تأكيد كلمة
                                    السر الجديدة <span style="color:red;">*</span></label>
                                <div style="position:relative;">
                                    <input type="password" id="adminConfirmPass"
                                        placeholder="أعد إدخال كلمة السر الجديدة"
                                        style="width:100%;box-sizing:border-box;padding:12px 40px 12px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem;outline:none;">
                                    <i class="fa-solid fa-check-double"
                                        style="position:absolute;right:12px;top:15px;color:#94a3b8;"></i>
                                </div>
                            </div>

                            <div style="display:flex;gap:15px;margin-top:15px;">
                                <button type="button" onclick="saveAdminPassword()"
                                    style="flex:2;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:white;border:none;padding:12px 20px;border-radius:8px;font-size:1.1rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 4px 12px rgba(59,130,246,0.3);">
                                    <i class="fa-solid fa-floppy-disk"></i> حفظ كلمة السر
                                </button>
                                <button type="button" onclick="goTo('pg-saas-admin')"
                                    style="flex:1;background:#f1f5f9;color:#475569;border:1px solid #cbd5e1;padding:12px 20px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;">
                                    <i class="fa-solid fa-xmark"></i> إلغاء
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
