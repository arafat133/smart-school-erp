<div class="page" id="pg-cashboxes">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-cash-register"></i> إدارة الصناديق والخزائن المالية (Cash Boxes & Safes Management)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-vault" style="color:#3b82f6;margin-left:6px;"></i> إجمالي الصناديق</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="cashTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد الصناديق المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-coins" style="color:#10b981;margin-left:6px;"></i> الرصيد الإجمالي</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="cashBalance">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">مجموع أرصدة جميع الصناديق</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-check-circle" style="color:#f59e0b;margin-left:6px;"></i> صناديق نشطة</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="cashActive">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الصناديق العاملة حالياً</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div style="display:flex;gap:10px;flex:1;max-width:560px;flex-wrap:wrap;">
            <div class="search-box" style="flex:1;min-width:240px;">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="searchCashboxes" placeholder="بحث في الصناديق والخزائن..." oninput="renderCashboxesGrid()">
            </div>
            <select id="filterCashboxType" onchange="renderCashboxesGrid()" style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:#cbd5e1;padding:8px 14px;border-radius:8px;outline:none;cursor:pointer;font-family:inherit;">
                <option value="all">كل أنواع الصناديق</option>
                <option value="خزينة رئيسية">خزينة رئيسية</option>
                <option value="مبيعات يومية">مبيعات يومية</option>
                <option value="عهدة مستديمة">عهدة مستديمة</option>
                <option value="تحصيل رسوم دراسية">تحصيل رسوم دراسية</option>
                <option value="مصروفات نثرية">مصروفات نثرية</option>
            </select>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('cashboxes')"><i class="fa-solid fa-plus"></i> إضافة صندوق مالي جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود الصندوق</th>
                    <th>اسم الصندوق</th>
                    <th>نوع الصندوق</th>
                    <th>الرصيد الحالي</th>
                    <th>العملة</th>
                    <th>المسؤول</th>
                    <th>الحالة</th>
                    <th>آخر حركة</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-cashboxes-grid"></tbody>
        </table>
    </div>
</div>
