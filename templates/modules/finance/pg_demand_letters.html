<div class="page" id="pg-demand-letters">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-envelope-open-text"></i> خطابات المطالبات المالية (Financial Demand Letters)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-envelopes-bulk" style="color:#3b82f6;margin-left:6px;"></i> إجمالي الخطابات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="dlTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد خطابات المطالبة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-paper-plane" style="color:#10b981;margin-left:6px;"></i> خطابات مرسلة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="dlSent">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">تم إرسالها بنجاح</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-hourglass-half" style="color:#f59e0b;margin-left:6px;"></i> بانتظار الرد</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="dlPending">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">لم يتم الرد عليها</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchDemandletters" placeholder="بحث في خطابات المطالبة..." oninput="renderDemandLettersGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('demand-letters')"><i class="fa-solid fa-plus"></i> إنشاء خطاب مطالبة جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>رقم الخطاب</th>
                    <th>اسم المطالب</th>
                    <th>المبلغ المستحق</th>
                    <th>تاريخ الإرسال</th>
                    <th>تاريخ الاستحقاق</th>
                    <th>الحالة</th>
                    <th>عدد المتابعات</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-demand-letters-grid"></tbody>
        </table>
    </div>
</div>
