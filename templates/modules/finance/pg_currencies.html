<div class="page" id="pg-currencies">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-money-bill-wave"></i> إدارة العملات وأسعار الصرف (Currencies & Exchange Rates)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-coins" style="color:#3b82f6;margin-left:6px;"></i> عدد العملات</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="currTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">العملات المسجلة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-star" style="color:#10b981;margin-left:6px;"></i> العملة الأساسية</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="currBase">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">العملة الافتراضية للنظام</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-refresh" style="color:#f59e0b;margin-left:6px;"></i> آخر تحديث</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="currUpdate">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">تاريخ آخر تحديث للأسعار</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchCurrencies" placeholder="بحث في العملات..." oninput="renderCurrenciesGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('currencies')"><i class="fa-solid fa-plus"></i> إضافة عملة جديدة</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود العملة</th>
                    <th>اسم العملة</th>
                    <th>الرمز</th>
                    <th>سعر الصرف</th>
                    <th>النوع</th>
                    <th>الحالة</th>
                    <th>آخر تحديث</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-currencies-grid"></tbody>
        </table>
    </div>
</div>
