<div class="page" id="pg-checks">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-money-check"></i> إدارة الشيكات الواردة والصادرة (Checks Management (Incoming & Outgoing))</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-arrow-down" style="color:#10b981;margin-left:6px;"></i> شيكات واردة</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="chkIncoming">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الشيكات المستلمة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #ef4444;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-arrow-up" style="color:#ef4444;margin-left:6px;"></i> شيكات صادرة</h3>
                                <p style="color:#f87171;font-weight:800;font-size:1.2rem;" id="chkOutgoing">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">الشيكات المحررة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #f59e0b;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-hourglass-half" style="color:#f59e0b;margin-left:6px;"></i> شيكات معلقة</h3>
                                <p style="color:#fbbf24;font-weight:800;font-size:1.2rem;" id="chkPending">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">بانتظار التحصيل</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchChecks" placeholder="بحث برقم الشيك أو اسم المستفيد..." oninput="renderChecksGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('checks')"><i class="fa-solid fa-plus"></i> تسجيل شيك جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>رقم الشيك</th>
                    <th>النوع</th>
                    <th>المستفيد / الدافع</th>
                    <th>المبلغ</th>
                    <th>تاريخ الاستحقاق</th>
                    <th>البنك</th>
                    <th>الحالة</th>
                    <th>ملاحظات</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-checks-grid"></tbody>
        </table>
    </div>
</div>
