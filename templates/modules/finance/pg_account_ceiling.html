<div class="page" id="pg-account-ceiling">
    <div class="page-header">
        <button class="btn-back" onclick="goTo('pg-dashboard')"><i class="fa-solid fa-arrow-right"></i></button>
        <h2><i class="fa-solid fa-arrow-up-from-bracket"></i> سقوف الحسابات والحدود المالية (Account Ceilings & Financial Limits)</h2>
    </div>

    <!-- KPI Cards -->
    <div class="stats-row" style="margin-bottom:16px;">
                        <div class="stat-card" style="border-right:4px solid #3b82f6;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-ruler-vertical" style="color:#3b82f6;margin-left:6px;"></i> إجمالي السقوف</h3>
                                <p style="color:#60a5fa;font-weight:800;font-size:1.2rem;" id="ceilTotal">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">عدد السقوف المحددة</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #ef4444;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;margin-left:6px;"></i> تجاوزات نشطة</h3>
                                <p style="color:#f87171;font-weight:800;font-size:1.2rem;" id="ceilViolations">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">حسابات تجاوزت السقف</small>
                            </div>
                        </div>
                        <div class="stat-card" style="border-right:4px solid #10b981;">
                            <div class="stat-info">
                                <h3><i class="fa-solid fa-shield-check" style="color:#10b981;margin-left:6px;"></i> سقوف سارية</h3>
                                <p style="color:#34d399;font-weight:800;font-size:1.2rem;" id="ceilActive">0</p>
                                <small style="color:var(--muted);font-size:0.75rem;">السقوف المفعلة</small>
                            </div>
                        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar" style="justify-content:space-between;display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
        <div class="search-box" style="flex:1;max-width:360px;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input id="searchAccountceiling" placeholder="بحث في سقوف الحسابات..." oninput="renderAccountCeilingGrid()">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn-add" onclick="openForm('account-ceiling')"><i class="fa-solid fa-plus"></i> تحديد سقف حساب جديد</button>
            <button class="btn-add" onclick="triggerOfficialPrint()" style="background:linear-gradient(135deg,#6366f1,#4f46e5);"><i class="fa-solid fa-print"></i> طباعة</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-wrapper">
        <table class="data-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>كود الحساب</th>
                    <th>اسم الحساب</th>
                    <th>السقف المحدد</th>
                    <th>المستخدم الحالي</th>
                    <th>النسبة المئوية</th>
                    <th>الحالة</th>
                    <th>تاريخ التفعيل</th>
                    <th>إجراءات</th>
                </tr>
            </thead>
            <tbody id="tbl-account-ceiling-grid"></tbody>
        </table>
    </div>
</div>
